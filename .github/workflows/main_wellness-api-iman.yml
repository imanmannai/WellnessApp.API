name: Build and deploy .NET API to Azure Web App - wellness-api-iman

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WellnessApp.API/WellnessApp.API.csproj

      - name: Build
        run: dotnet build WellnessApp.API/WellnessApp.API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish WellnessApp.API/WellnessApp.API.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-api
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4BA9FCC390D348A89DB917A4017E7091 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ACB56A911E344CAB9416852E614AEF3C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FBFE56709A464BCD9CAE07E1F347FA32 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'wellness-api-iman'
          slot-name: 'Production'
          package: ./publish
