name: Build and deploy React frontend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'wellnessapp.web/**'
      - '.github/workflows/deploy-wellness-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wellnessapp.web/package-lock.json

      - name: Install dependencies
        working-directory: wellnessapp.web
        run: npm ci

      - name: Build React app
        working-directory: wellnessapp.web
        run: npm run build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: wellness-web-iman
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ./wellnessapp.web/dist
